services:
  db:
    image: postgis/postgis:16-3.4
    container_name: wildlink-db
    environment:
      POSTGRES_USER: wildlink
      POSTGRES_PASSWORD: wildlink_dev
      POSTGRES_DB: wildlink_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildlink -d wildlink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wildlink-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildlink:wildlink_dev@db:5432/wildlink_db
      DATABASE_URL_SYNC: postgresql://wildlink:wildlink_dev@db:5432/wildlink_db
      JWT_SECRET: dev-secret-key-not-for-production
      APP_ENV: development
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wildlink-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
